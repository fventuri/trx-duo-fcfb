# FT8 + FT4 + WSPR + FST4W on every band 40 m and up, on BOTH ADCs (64 channels),
# one shared stream. Generated from allbands.ini (each channel duplicated adc=1/adc=2).
[board]
ip       = 192.168.255.20
udp_port = 55055
guard    = 3
workers  = 8
mtu      = 3980            # host NIC reaching the board must be at this exact MTU
                           # or the farm fails fast (jumbo frames silently dropped)

# ---- decoders (channels reference these by name) ----
[decoder]
name    = ft8
cmd     = jt9 --ft8 {wav}
parser  = jt9
period  = 15
capture = 13.5

[decoder]
name    = ft4
cmd     = jt9 --ft4 {wav}
parser  = jt9
period  = 7.5
capture = 6.0

[decoder]
name    = wspr
cmd     = wsprd -f {fmhz} {wav}
parser  = wspr
period  = 120
capture = 114

# FST4W-120: jt9 --fst4w output uses a 4-digit HHMM timestamp, so parser = fst4w.
[decoder]
name    = fst4w
cmd     = jt9 --fst4w -p 120 -f 1500 {wav}
parser  = fst4w
period  = 120
capture = 116

# ---- 40 m ----

# All bands on BOTH ADCs: every channel is emitted twice, adc=1 (ADC A,
# name suffix "A") and adc=2 (ADC B, name suffix "B").

[channel]
fc = 7.074e6
decoder = ft8
name = 40mF8A
adc = 1
[channel]
fc = 7.074e6
decoder = ft8
name = 40mF8B
adc = 2

[channel]
fc = 7.0475e6
decoder = ft4
name = 40mF4A
adc = 1
[channel]
fc = 7.0475e6
decoder = ft4
name = 40mF4B
adc = 2

[channel]
fc = 7.0386e6
decoder = wspr
name = 40mWA
adc = 1
[channel]
fc = 7.0386e6
decoder = wspr
name = 40mWB
adc = 2

[channel]
fc = 7.0386e6
decoder = fst4w
name = 40mFWA
adc = 1
[channel]
fc = 7.0386e6
decoder = fst4w
name = 40mFWB
adc = 2

