# FT8 + FT4 + WSPR + FST4W on every band 40 m and up, DUAL-ADC diversity
# (adc=3): each channel is reconstructed as ONE stereo WAV (L=ADC A, R=ADC B),
# sample-locked, then split + decoded per antenna by wav-to-decoder.
# PREREQ: `wav-to-decoder` must be on PATH (install -m755 wav-to-decoder /usr/local/bin/).
[board]
ip       = 192.168.255.20
udp_port = 55055
guard    = 3
workers  = 8
recon_workers = 2         # 2 parallel reconstruction goroutines (64 dual-ADC chains)
mtu      = 3980            # host NIC reaching the board must be at this exact MTU
                           # or the farm fails fast (jumbo frames silently dropped)

# ---- decoders (channels reference these by name) ----
[decoder]
name    = ft8
cmd     = wav-to-decoder jt9 --ft8 {wav}
parser  = jt9
period  = 15
capture = 13.5

[decoder]
name    = ft4
cmd     = wav-to-decoder jt9 --ft4 {wav}
parser  = jt9
period  = 7.5
capture = 6.0

[decoder]
name    = wspr
cmd     = wav-to-decoder wsprd -f {fmhz} {wav}
parser  = wspr
period  = 120
capture = 114

# FST4W-120: jt9 --fst4w output uses a 4-digit HHMM timestamp, so parser = fst4w.
[decoder]
name    = fst4w
cmd     = wav-to-decoder jt9 --fst4w -p 120 -f 1500 {wav}
parser  = fst4w
period  = 120
capture = 116

# ---- 40 m ----
