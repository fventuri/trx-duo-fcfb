# fcfbfarm config -- DUAL-ADC (diversity) example.  Run: ./fcfbfarm -config farm.example.dual.ini
#
# adc = 3 requests a bin on BOTH ADCs at once and reconstructs them into a single
# STEREO WAV (left = ADC A, right = ADC B), sample-for-sample time-locked -- the
# foundation for diversity reception.  A mono decoder (jt9/wsprd) can't read a
# stereo file, so a dual channel's decoder is wrapped with `dual-decoder`, which
# splits the stereo WAV and runs the real decoder on each antenna in sequence
# (one worker slot per dual channel).
#
# PREREQUISITE: `dual-decoder` (shipped next to fcfbfarm) must be on your PATH,
# e.g.  sudo install -m755 dual-decoder /usr/local/bin/   (or add this dir to PATH).
# The board server must support adc=3 (grants the bin on both ADCs).

[board]
ip       = 192.168.255.20
udp_port = 55055
guard    = 3
workers  = 8               # one dual channel = one worker slot (its two decodes run in sequence)
mtu      = 3980

# ---- dual decoders: same tools as usual, wrapped in dual-decoder --------------
[decoder]
name    = ft8d
cmd     = dual-decoder jt9 --ft8 {wav}
parser  = jt9
period  = 15
capture = 13.5

[decoder]
name    = wsprd2
cmd     = dual-decoder wsprd -f {fmhz} {wav}
parser  = wspr
period  = 120
capture = 114

[decoder]
name    = fst4w120d
cmd     = dual-decoder jt9 --fst4w -p 120 -f 1500 {wav}
parser  = fst4w
period  = 120
capture = 116

# ---- dual (adc=3) channels: one stereo WAV per window, both antennas -----------
[channel]
fc      = 7.074e6
decoder = ft8d
adc     = 3               # 3 = both ADCs (diversity); 1 = A, 2 = B
name    = 40mF8d

[channel]
fc      = 7.0386e6
decoder = wsprd2
adc     = 3
name    = 40mWd

[channel]
fc      = 14.074e6
decoder = ft8d
adc     = 3
name    = 20mF8d

# Optional fcfbfarm-only settings.  savewav keeps every decoder WAV instead of
# using a temporary file that is deleted after decoding: each window's WAV is
# written to this path template (and the decoder is run on it in place).  For a
# dual (adc=3) channel the WAV is stereo (L=ADC A, R=ADC B) and {antenna} is AB.
# Substituted: {date} YYYYMMDD, {timestamp} YYYYMMDD_HHMMSS (YYYYMMDD_HHMM for
# slow modes: WSPR/FST4W), {channel} the channel name, {antenna} A/B/AB (adc
# 1/2/3), {frequency} centre freq in whole Hz (e.g. 10 MHz -> 10000000),
# {decoder} the decoder name.  A leading ~ is the user's home directory.
# Parent directories are created as needed.
# [fcfbfarm]
# savewav = ~/fcfb/wavs/{date}/{channel}/{antenna}-{timestamp}.wav
