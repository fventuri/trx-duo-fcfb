# fcfbfarm config -- I/Q (float32) example.  Run: ./fcfbfarm -config farm.example.iq.ini
#
# With wav_format = iq, each window is written as a complex float32 WAV instead of
# real int16 audio: 2 channels [I, Q] for a single ADC, 4 channels
# [I_A, Q_A, I_B, Q_B] for a dual-ADC (adc=3) diversity channel.  The samples are
# un-normalised true baseband centred at the channel fc, so relative amplitude and
# phase (between I/Q and, for dual, between antennas) are preserved -- the input a
# diversity combiner wants.  Center freq and UTC window bounds are stored in an
# "auxi" chunk.  See the I/Q-format section of README.md.
#
# Because the decoders (jt9/wsprd) read mono real audio, every decoder cmd routes
# through `wav-to-decoder`, which converts the I/Q to audio (real part) and runs the
# decoder -- autodetecting single vs dual (and emitting #ANT A/B for dual), exactly
# as it does for the stereo-audio case.  `wav-to-decoder` ships next to fcfbfarm;
# put it on your PATH (e.g. sudo install -m755 wav-to-decoder /usr/local/bin/).
#
# savewav keeps the I/Q files; drop it to decode from I/Q live without keeping them.

[board]
ip       = 192.168.255.20
udp_port = 55055
guard    = 3
workers  = 8
mtu      = 3980

[fcfbfarm]
wav_format = iq
savewav    = ~/fcfb/iq/{date}/{channel}/{antenna}-{timestamp}.wav

[decoder]
name    = ft8
cmd     = wav-to-decoder jt9 --ft8 {wav}
parser  = jt9
period  = 15
capture = 13.5

[decoder]
name    = wspr
cmd     = wav-to-decoder wsprd -f {fmhz} {wav}
parser  = wspr
period  = 120
capture = 114

# single ADC -> 2-channel [I,Q] file, {antenna}=A
[channel]
fc      = 7.074e6
decoder = ft8
adc     = 1
name    = 40mF8iq

# dual ADC -> 4-channel [I_A,Q_A,I_B,Q_B] file, {antenna}=AB
[channel]
fc      = 7.074e6
decoder = ft8
adc     = 3
name    = 40mF8iqd

[channel]
fc      = 7.0386e6
decoder = wspr
adc     = 1
name    = 40mWiq
