# FT8 + FT4 + WSPR + FST4W on every band 80 m and up, DUAL-ADC diversity (adc=3),
# decoded with COMMON-MODE CANCELLING: each channel is reconstructed as one 4-ch
# I/Q WAV (I_A,Q_A,I_B,Q_B), sample-locked, then decoded THREE ways by
# common-mode-cancelling -- antenna A, antenna B, and C = B-beta*A (#ANT A/B/CMC).
# No savewav => the intermediate I/Q WAVs are temp files, deleted after each decode
# (nothing accumulates on disk).
# PREREQ: `common-mode-cancelling` (and jt9/wsprd) must be on PATH.
[board]
ip       = 192.168.255.20
udp_port = 55055
guard    = 3
workers  = 8
recon_workers = 2         # 2 parallel reconstruction goroutines (64 dual-ADC chains)
mtu      = 3980            # host NIC reaching the board must be at this exact MTU
                           # or the farm fails fast (jumbo frames silently dropped)

[fcfbfarm]
# 4-channel float32 complex I/Q (I_A,Q_A,I_B,Q_B) -- required by
# common-mode-cancelling (it needs both antennas' complex baseband to form B-beta*A).
wav_format = iq
# No savewav => each window's I/Q WAV is a temp file, deleted right after decoding.

# ---- decoders (channels reference these by name) ----
[decoder]
name    = ft8
cmd     = common-mode-cancelling jt9 --ft8 {wav}
parser  = jt9
period  = 15
capture = 13.5

[decoder]
name    = ft4
cmd     = common-mode-cancelling jt9 --ft4 {wav}
parser  = jt9
period  = 7.5
capture = 6.0

[decoder]
name    = wspr
cmd     = common-mode-cancelling wsprd -f {fmhz} {wav}
parser  = wspr
period  = 120
capture = 114

# FST4W-120: jt9 --fst4w output uses a 4-digit HHMM timestamp, so parser = fst4w.
[decoder]
name    = fst4w
cmd     = common-mode-cancelling jt9 --fst4w -p 120 -f 1500 {wav}
parser  = fst4w
period  = 120
capture = 116

