# fcfbhpsdr config (INI/TOML-style).  Run:  ./fcfbhpsdr -config hpsdr.ini
#
# Same style as farm.example.ini.  [board] is the live board connection; [radio]
# repeats once per HPSDR radio identity.  Unlike the farm, the DDCs / frequencies /
# sample rates are chosen by the P2 CLIENT (piHPSDR/Thetis/linhpsdr) at runtime, so
# the config only describes the board link and the radio identities to advertise.
#
# With no [radio] section, one radio is served on 0.0.0.0 (all interfaces).

[board]
ip        = 192.168.255.20   # board IP (required)
udp_port  = 55055            # local UDP data port the board streams to (default 55055)
guard     = 3                # guard bins each side (default 3; must match a v4 server if != 3)
mtu       = 3980             # link MTU the board server was started with (-u); sets the bin
                             # budget (1500->242, 3980->655 int24).  MUST match the server.
# budget  = 655              # override the bin budget (union W_a+W_b cap) directly
gain      = 1.0              # I/Q output gain (default 1.0)
# bin_width = 24             # wire bin width for the budget formula (default 24)
# monitor_interval = 30      # board temperature-log poll interval in seconds (default 30;
                             # 0 = off).  Logs the board's XADC die temperature every
                             # interval (a full board-info dump is printed once at startup).
                             # Needs a board server new enough to answer BINF (older
                             # servers -> logged unavailable once, then quiet).
# recon_workers = 1          # parallel per-DDC reconstruction goroutines (default 1).
                             # Leave it at 1 for a single client: HW-measured, 8 DDCs @
                             # 1536 kHz (both ADCs) sustains on the SERIAL path at ~1 core
                             # with 0 drops -- the DSP for 8 DDCs is only ~1 core, and >1
                             # just ADDS ~0.8 cores of per-datagram fork-join overhead.
                             # recon_workers > 1 spreads synth+resample across cores
                             # (byte-identical output) and pays off only when you SCALE
                             # PAST one client -- many DDCs across several [radio]s
                             # (16/24/32...), where the serial DSP would exceed one core's
                             # real-time budget.
# kernel  = dual_K4.f64      # override the embedded synthesis kernel (advanced; must
                             # match the board's R=3125/T=4 -- see README)

# One radio on all interfaces (the common single-radio case).  Delete this and add
# per-IP [radio] blocks below for the multi-radio (Program B) fan-out.
[radio]
bind      = 0.0.0.0          # bind interface (0.0.0.0 = all; a specific IP for multi-radio)
board_id  = angelia          # advertised model: angelia (dual-ADC) | hermes | ... or a number
n_ddc     = 8                # DDCs advertised to the client (default 8)

# --- Multi-radio example (N radios sharing the one board stream) -------------------
# Put each radio on its own IP (real NIC aliases, not loopback, for linhpsdr):
#   sudo ip addr add 192.168.255.2/24 dev enp45s0
#   sudo ip addr add 192.168.255.3/24 dev enp45s0
#
# [radio]
# bind     = 192.168.255.2
# mac      = 02:00:00:fc:fb:02   # optional (default: locally-administered, per index)
# board_id = angelia
# n_ddc    = 8
#
# [radio]
# bind     = 192.168.255.3
# board_id = angelia
# n_ddc    = 8
