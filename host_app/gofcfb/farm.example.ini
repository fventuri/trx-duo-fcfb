# fcfbfarm config (INI/TOML-style).  Run:  ./fcfbfarm -config farm.ini
#
# [board] is the live board; [decoder] defines each external decoder; [channel]
# repeats once per receiver and references a decoder by name.  To decode a
# captured v3 .bin offline instead of the board, set `replay =` in [board].

[board]
ip       = 192.168.255.20   # board IP (omit + set replay= for offline decode)
udp_port = 55055            # UDP data port (default 55055)
guard    = 3                # guard bins each side (default 3; must match a v4 server if != 3)
workers  = 8                # max windows decoded in parallel (decoder subprocesses)
# recon_workers = 1         # reconstruction goroutines (default 1 = single-threaded
#                           # ingest). >1 splits the per-channel synth/resample across
#                           # cores; only needed past ~100 channels (see the parallel
#                           # reconstruction NOTE). The ingest goroutine still owns
#                           # seq accounting, so output is byte-identical to recon=1.
mtu      = 3980             # if set, the host NIC reaching the board must be at
                            # this exact MTU or the farm fails fast at startup
                            # (jumbo frames are silently dropped otherwise)
# replay = capture.bin      # decode one captured v3 window offline (ignores ip)
# kernel = dual.f64         # override the embedded synthesis kernel (advanced;
                            # must match the board's R=3125/T=4 -- see README)
# monitor_interval = 30     # board temperature-log poll interval in seconds (default 30;
                            # 0 = off).  Logs the board's XADC die temperature every
                            # interval (a full board-info dump is printed once at startup).
                            # Needs a board server new enough to answer BINF (older
                            # servers -> logged unavailable once, then quiet).

# A [decoder] is a named external command plus its window timing and output
# parser.  Placeholders in cmd: {wav} (WAV path), {fmhz}/{fhz} (centre freq in
# MHz/Hz), {utc}.  parser is jt9 or wspr (how the tool's output is read).
[decoder]
name    = ft8
cmd     = jt9 --ft8 {wav}
parser  = jt9
period  = 15
capture = 13.5
# rate  = 12000            # optional WAV sample rate (default 12000; jt9/wsprd want 12000)

[decoder]
name    = wspr
cmd     = wsprd -f {fmhz} {wav}
parser  = wspr
period  = 120
capture = 114

# FST4W: the slow WSPR-like WSJT-X mode, decoded by jt9 --fst4w.  Its output is
# the jt9 layout with a 4-digit HHMM timestamp, so it needs parser = fst4w (not
# jt9).  -f 1500 is the audio offset our reconstruction centres on (as WSPR/FT8
# do); tune the channel to the FST4W dial.  Periods 120/300/900/1800 all divide
# the hour.  (Add `-a .` to the cmd if compound/hashed calls show as <...>.)
[decoder]
name    = fst4w120
cmd     = jt9 --fst4w -p 120 -f 1500 {wav}
parser  = fst4w
period  = 120
capture = 116

[channel]
fc      = 7.074e6           # dial frequency (Hz)
decoder = ft8              # references a [decoder] by name
adc     = 1                # 1 = ADC A, 2 = ADC B
name    = 40m

[channel]
fc      = 7.0386e6
decoder = wspr
name    = 40mW

[channel]
fc      = 7.0386e6         # FST4W-120 shares the 40 m WSPR dial
decoder = fst4w120
name    = 40mFST4W

[channel]
fc      = 14.074e6
decoder = ft8
name    = 20m

[channel]
fc      = 14.0956e6
decoder = wspr
name    = 20mW
