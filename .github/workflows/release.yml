name: Release

# Build the host binaries, package them, and attach a single SHA256SUMS.txt
# covering the host zips and the board SD-card image.
#
# How to cut a release:
#   1. If the board image changed: build it locally
#      (buildroot/build-fcfb.sh -> sdcard.img) and upload sdcard.img to the
#      release.  For a host-only release you can skip this — the workflow carries
#      the sdcard.img forward from the most recent prior release that has one, so
#      every release ships a board image.
#   2. Create the release for the tag (e.g. v1.0.0) and publish it.  This workflow
#      then cross-compiles the three host binaries, zips them (Linux / Windows /
#      macOS), ensures an sdcard.img is present (attached or carried forward),
#      writes SHA256SUMS.txt over the image + zips, and uploads the zips,
#      SHA256SUMS.txt (and any carried-forward image) back to the release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach artifacts to"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: host_app/gofcfb/go.mod
          cache: false

      - name: Build and package host binaries
        working-directory: host_app/gofcfb
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # extras shipped alongside the binaries in every zip (example configs go
          # in an examples/ subdir, matching the repo layout the README points to)
          EXTRAS="README.md dd-soak"

          build_zip() {
            local goos="$1" goarch="$2" label="$3" ext="$4"
            local stage="fcfb-host-$label"
            rm -rf "$stage"; mkdir -p "$stage"
            for cmd in fcfbfarm fcfbhpsdr fcfbinfo wav-to-decoder common-mode-cancelling; do
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o "$stage/$cmd$ext" "./cmd/$cmd"
            done
            cp $EXTRAS "$stage/"
            cp -r examples "$stage/"
            (cd "$stage" && zip -r "$GITHUB_WORKSPACE/dist/$stage.zip" .)
          }

          build_zip linux   amd64 linux-amd64   ""
          build_zip windows amd64 windows-amd64 ".exe"
          build_zip darwin  arm64 macos-arm64   ""

          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Ensure the release has a board SD-card image
        working-directory: dist
        run: |
          set -euo pipefail
          # Every release ships an sdcard.img so users can download the board image
          # from any release, even one that only changed host code.  Prefer an image
          # attached to this tag; otherwise carry forward the most recent prior
          # release that has one and attach it to this release too.
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'sdcard.img' --dir . 2>/dev/null; then
            echo "Using sdcard.img attached to $TAG."
          else
            echo "$TAG has no sdcard.img — carrying one forward from a prior release."
            found=""
            for t in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
                         --limit 100 --json tagName --jq '.[].tagName'); do
              [ "$t" = "$TAG" ] && continue
              if gh release download "$t" --repo "$GITHUB_REPOSITORY" --pattern 'sdcard.img' --dir . 2>/dev/null; then
                found="$t"; break
              fi
            done
            if [ -n "$found" ]; then
              echo "Carried forward sdcard.img from $found; attaching it to $TAG."
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber sdcard.img
            else
              echo "No sdcard.img found on any release — SHA256SUMS will cover host zips only."
            fi
          fi

      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.img *.zip )
          sha256sum "${files[@]}" | tee SHA256SUMS.txt

      - name: Upload artifacts to the release
        working-directory: dist
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            *.zip SHA256SUMS.txt
