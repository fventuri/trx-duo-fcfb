# fcfb zero-copy egress: force u-dma-buf quirk_mmap_mode=4 (PAGE) so the mmap is
# page-backed (vmf_insert_page / VM_MIXEDMAP) and get_user_pages can pin it for
# UDP MSG_ZEROCOPY. Backs up the DT `option=<0x0 0x1020>` on the udmabuf node in
# case the boot module load path does not honor the DT option. Mode 2 (the ARM
# default) is VM_PFNMAP and EFAULTs zero-copy sends.
options u-dma-buf quirk_mmap_mode=4
